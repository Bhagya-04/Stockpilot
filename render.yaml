# Render Blueprint for BOTH services in this monorepo (New -> Blueprint, pick this repo).
#   * stockpilot-api : FastAPI backend (Docker web service, free plan sleeps after ~15 min idle)
#   * stockpilot-web : React frontend (free Static Site)
# The database is NOT created here: Render's free Postgres expires after 30 days. Use a free Neon database
# and paste its connection string into DATABASE_URL in the Render dashboard.
# NOTE: written from the provider's documented schema; it has not been deployed from this repo yet.
services:
  - type: web
    name: stockpilot-api
    runtime: docker
    plan: free
    dockerfilePath: ./Stockpilot_BE/Dockerfile
    dockerContext: ./Stockpilot_BE
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false             # Neon connection string (postgresql://...?sslmode=require)
      - key: SECRET_KEY
        generateValue: true     # generated by Render; never stored in the repo
      - key: CORS_ORIGINS
        sync: false             # the deployed frontend URL, e.g. https://stockpilot-web.onrender.com (no trailing slash)
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: stockpilot-web
    runtime: static
    rootDir: Stockpilot_FE
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE_URL
        sync: false             # https://<stockpilot-api host>.onrender.com/api/v1  (baked in at build time)
      - key: VITE_CURRENCY
        value: INR
      - key: VITE_LOCALE
        value: en-IN
    routes:
      - type: rewrite           # single-page app: deep links must serve index.html
        source: /*
        destination: /index.html
